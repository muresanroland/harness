# Builds the release binaries for a v* tag and attaches them to a GitHub
# Release. The tag must equal Cargo.toml's version. After the merge the human
# creates the release on GitHub (or pushes the tag); either starts this. Run
# it by hand from the Actions tab to rebuild an existing tag.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: tag must equal Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "${TAG#v}" = "$version" || { echo "tag $TAG != Cargo.toml version $version"; exit 1; }
      - name: build
        env:
          ORQADENCE_RELEASE: '1'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          cp -f target/${{ matrix.target }}/release/orqa orqa-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: orqa-${{ matrix.target }}
          path: orqa-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # A release made on GitHub already exists by now: it gets the assets.
      # A plain tag push has none yet: this creates it.
      - name: attach both assets to the release, creating it if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="orqa-aarch64-apple-darwin orqa-x86_64-unknown-linux-gnu"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $assets
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes $assets
          fi
